# Сборка APK и публикация в GitHub Releases по тегу версии (например, v1.3.0).
# Страница загрузки на GitHub Pages всегда ссылается на последний релиз.
name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  apk:
    needs: checks
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Тег и версия в app.json должны совпадать: иначе в релизе окажется не та версия
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $APP_VERSION в app.json"
            exit 1
          fi

      - run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # Собственный ключ подписи, если он добавлен в секреты репозитория
      # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD). Без секретов остается прежняя подпись — см. DEPLOY.md.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "CKOM_UPLOAD_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "CKOM_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CKOM_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "CKOM_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Подпись: собственный ключ"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан общедоступным debug-ключом. См. DEPLOY.md"
          fi

      # NODE_ENV=production только здесь: на уровне задачи он заставил бы
      # npm ci пропустить devDependencies
      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk CKOM.apk

      # Отпечаток подписи в журнале: обновление ставится поверх, только если он не изменился
      - name: Show signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs CKOM.apk | grep -E "SHA-256"

      - uses: softprops/action-gh-release@v2
        with:
          files: CKOM.apk
          generate_release_notes: true
